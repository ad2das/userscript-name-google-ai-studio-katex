<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Studio userscript fixture</title>
</head>
<body>
  <button type="submit" class="ctrl-enter-submits ms-button-primary" aria-disabled="false">
    <span class="run-button-label">Run</span>
  </button>

  <ms-chat-turn>
    <div class="chat-turn-container model">
      <ms-cmark-node>
        <p id="split-bold"><span>*</span><span>*split </span><em>bold</em><span>**</span></p>
        <p id="multiple-bold">**first** and <span>**sec</span><span>ond**</span></p>
        <p id="split-bold-italic"><span>**</span><span>*very important</span><span>***</span></p>
        <p id="math-adjacent-bold">Formula $x$ remains raw while **this is bold**.</p>
        <p id="code-boundary-bold"><span>**do not </span><code>cross code</code><span> here**</span></p>
        <p id="link-boundary-bold"><span>**do not </span><a href="#">cross links</a><span> here**</span></p>
        <table>
          <tbody>
            <tr>
              <td id="literal-break-cell">first<span>&lt;</span><span>br</span><span>&gt;</span>second<span>&lt;br /</span><span>&gt;</span>third **bold**</td>
            </tr>
            <tr>
              <td><code id="literal-code">&lt;br&gt;</code></td>
              <td id="block-boundary"><p>&lt;br</p><p>&gt;</p></td>
              <td id="link-boundary"><span>&lt;</span><a href="#">ignored</a><span>br&gt;</span></td>
            </tr>
          </tbody>
        </table>
      </ms-cmark-node>
    </div>
  </ms-chat-turn>
</body>
</html>
